# configs/mappo_config.yaml

experiment:
  name: "mappo_coevolution_review2"
  seed: 42
  num_episodes: 380            # 380 episodes across benign + adversarial co-evolution
  max_steps_per_episode: 4     # 4 turns per episode

training:
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  clip_epsilon: 0.2
  critic_lr: 0.00003           # 3e-5 Critic value convergence
  actor_lr: 0.002              # responsive Attacker MLP exploration across weak categories
  defender_lr: 0.000018        # 1.8e-5 PPO adaptation on top of clean SFT checkpoint
  max_grad_norm: 0.5           # standard PPO-with-transformer value
  mini_batch_size: 4

models:
  critic_model: "distilbert-base-uncased"
  defender_model: "distilbert-base-uncased"
  attacker_state_dim: 8        # dimensionality of encode_obs() output vector
  attacker_action_dim: 10      # number of attack categories (matches ATTACK_CATEGORIES: 10)
  device: "auto"

logging:
  wandb_project: "mappo-sec-defense"
  wandb_mode: "disabled"       # set to "online" when W&B credentials are configured
  log_interval: 20             # print + checkpoint every 20 episodes
  checkpoint_dir: "checkpoints/mappo_run"  # directory for saved model weights
  output_dir: "reports"        # directory for JSON metric reports (review2_coevolution_metrics.json)